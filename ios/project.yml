name: Mia
options:
  bundleIdPrefix: com.reddwu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The AI Debater LLC — publishes Echowords on TestFlight / App Store.
    DEVELOPMENT_TEAM: JBGQGJ6A3C
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  Mia:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: Supabase
      - target: MiaShare
    entitlements:
      path: App/Mia.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.reddwu.mia
        com.apple.developer.applesignin:
          - Default
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Echowords
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.reddwu.mia.auth
            CFBundleURLSchemes: [mia]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_PUBLISHABLE_KEY)
        MiaWebURL: $(MIA_WEB_URL)
        # only standard HTTPS — exempt; skips the export-compliance prompt on every upload
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reddwu.mia
        # iPhone only (portrait UI); an iPad build would have to support every orientation
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Echowords
  MiaShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared
        excludes: []
    entitlements:
      path: ShareExtension/MiaShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.reddwu.mia
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Echowords
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reddwu.mia.share
        TARGETED_DEVICE_FAMILY: "1"
  MiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reddwu.mia.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mia:
    build:
      targets:
        Mia: all
        MiaShare: all
    test:
      targets:
        - MiaTests
