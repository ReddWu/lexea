<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root{
      --ink:#242424;--muted:#6b6b6b;--faint:#a8a8a8;--line:#f2f2f2;--line-strong:#e6e6e6;
      --green:#1a8917;--green-dark:#156d12;--danger:#c94a4a;
      --serif:"Charter","Georgia",serif;
    }
    body{font:13px/1.5 -apple-system,system-ui,sans-serif;width:340px;margin:0;padding:16px;color:var(--ink);background:#fff;}
    .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
    .brand{font:700 20px/1 var(--serif);letter-spacing:-0.3px;}
    .count{font-size:12px;color:var(--muted);}
    .top a{color:var(--muted);cursor:pointer;text-decoration:none;margin-left:8px;font-size:12px;}
    .top a:hover{color:var(--ink);}
    .primary{display:block;width:100%;background:var(--green);color:#fff;border:none;border-radius:99px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;}
    .primary:hover{background:var(--green-dark);}
    .bar{display:flex;gap:6px;margin-bottom:12px;}
    .bar button{flex:1;background:#fff;color:var(--ink);border:1px solid var(--line-strong);border-radius:99px;padding:8px;font-size:12px;font-weight:500;cursor:pointer;}
    .bar button:hover{border-color:var(--ink);}
    #copyStatus{font-size:11px;color:var(--green);text-align:center;min-height:14px;margin-bottom:4px;}
    ul{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;border-top:1px solid var(--line-strong);}
    li{position:relative;padding:9px 22px 9px 0;border-bottom:1px solid var(--line);}
    .w{font:700 14px/1.3 var(--serif);}
    .c{color:var(--muted);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .del{position:absolute;top:8px;right:0;border:none;background:none;color:#d6d6d6;font-size:14px;cursor:pointer;line-height:1;padding:2px 4px;}
    .del:hover{color:var(--danger);}
    .empty{color:var(--faint);text-align:center;padding:24px 0;}
    .empty a{color:var(--green);cursor:pointer;}
  </style>
</head>
<body>
  <div class="top">
    <span class="brand">Echowords</span>
    <span>
      <span class="count" id="count"></span>
      <a id="settings">Settings</a>
    </span>
  </div>
  <div id="auth" style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px;min-height:18px;">
    <span id="authWho"></span>
    <a id="authAction" style="color:var(--green);cursor:pointer;font-weight:600;"></a>
  </div>
  <button class="primary" id="talk">Talk to Echowords <span id="due"></span></button>
  <div class="bar">
    <button id="review">Flashcards</button>
    <button id="copy" title="Copy your weakest words as instructions for any AI chat">Copy for AI</button>
  </div>
  <div id="copyStatus"></div>
  <div class="bar">
    <button id="csv">Export CSV</button>
    <button id="json">Export JSON</button>
  </div>
  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none;">
    No words yet.<br />Select a word on any page and click <b>★ Save to Echowords</b>.
  </div>
  <script src="popup.js"></script>
</body>
</html>
